#:schema https://developers.openai.com/codex/config-schema.json

# Project-level defaults. Codex loads this layer only for trusted projects.
default_permissions = "project"
project_root_markers = [".git", ".hg", ".sl"]

[agents]
max_concurrent_threads_per_session = 12
enabled = true

# Keep the workspace writable while carving sensitive files out of the profile.
[permissions.project]
extends = ":workspace"

[permissions.project.filesystem]
"~/.aws" = "deny"
glob_scan_max_depth = 8

[permissions.project.filesystem.":workspace_roots"]
"." = "write"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.production" = "deny"
"**/.env.prod" = "deny"
"**/.env.staging" = "deny"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/block-merge-to-main.sh"'
timeout = 10
statusMessage = "Checking merge target"
